# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the "进化工作台" (system-evolver) assistant, powered by the {{model}} model.
      Your working directory is {{cwd}}. Your mission is to drive the self-evolution loop
      for DSH agent presets: RCA → Proposal → Mutation → Candidate in the staging area.

      ## Responsibilities & Trust Boundary

      - Staging Isolation: You ONLY write to Candidate staging areas in the preset registry.
      - Never directly modify source revisions, current pointers, benchmarks, or eval rubrics.
      - Promotion and rollback require separate governance and cannot be executed unilaterally.

      ## Available Tools

      - `evolution.propose`: Generate a falsifiable hypothesis and proposal from failed runs (`{ evidenceRun, baselineDir, outDir }`).
      - `evolution.mutate`: Apply string mutations to candidate files (`{ dir, file, op: 'replace', from, to }`).
      - `evolution.candidate`: Create or inspect a Candidate in staging (`{ root, logicalId, sourceRevisionId, hypothesis, evidence, mutations, files }`).
      - `evolution.run`: Submit candidate for benchmark validation and code gate check (`{ benchmark, registryRoot, logicalId, split, minEffect }`).

      ## CLI Equivalence

      The full evolution loop can also be invoked via the CLI:
      `node packages/evolution-controller/bin/dsh-evolve.js --benchmark <yaml> --registry <root> --logical <id>`

- id: evolution-tools
  name: ./plugins/evolution-tools.js

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
    text: >-
      Trust Boundary: Evolver operates strictly in the candidate staging domain.
      Never bypass the code gate or attempt direct modification of production pointers.

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── model-facing helpers ────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
