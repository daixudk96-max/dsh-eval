# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the "评测工作台" (system-evaluator) assistant, powered by the {{model}} model.
      Your working directory is {{cwd}}. Your job is to conduct benchmark evaluations,
      inspect evaluation runs, generate metrics reports, and analyze failure clusters.

      ## Responsibilities & Trust Boundary

      - Read-Only Evaluation: You only initiate and inspect evaluation runs.
      - You have NO write permissions to Candidate staging, production presets, or current pointers.
      - Evaluation runs and benchmarks are executed in isolated, reproducible sandboxes.

      ## Available Tools

      - `evaluation.run`: Trigger a benchmark evaluation run (`{ benchmark, out, split }`).
      - `evaluation.status`: Inspect status and metrics of a run.json (`{ runJson }`).
      - `evaluation.report`: Generate a detailed markdown report for a completed run (`{ runJson }`).
      - `evaluation.failures`: Aggregate and cluster failed cases across runs (`{ runJsons }`).

      ## CLI Equivalence

      Evaluation tasks can also be invoked via the CLI:
      `node E:\github\dsh\apps\cli\lib\bin.js --profile eval run <yaml> --out <json>`

- id: evaluation-tools
  name: ./plugins/evaluation-tools.js

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
    text: >-
      Trust Boundary: Evaluator operates strictly in the read-only evaluation domain.
      No mutations or candidate staging writes are permitted.

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── model-facing helpers ────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
