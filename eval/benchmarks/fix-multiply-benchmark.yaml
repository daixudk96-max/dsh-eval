name: fix-multiply-short
# Model id must exist in the effective provider's settings (clipa serves
# 'deepseek-v4-flash' without the ':0731' suffix; that suffix is ollama's id).
# provider pinned to clipa: the parent default route is ollama (cloud), whose
# model id is 'deepseek-v4-flash:0731' — inheriting it with this model id
# mismatched and every run produced 0 tokens (fixed 2026-08-22).
provider: clipa
model: deepseek-v4-flash
profile: headless
trials: 1
timeoutMs: 180000
seed: 42
cases:
  - id: fix-multiply
    prompt: |
      Fix the bug in this small JavaScript project (see README.md).
      Requirements: fix src/multiply.js so multiply(a, b) returns a * b,
      run `node tests/run.js` until it prints PASS, and write ANSWER.md
      with a short explanation. Do not modify check.js or tests/run.js.
    workspace: E:\github\dsh-eval\eval\benchmarks\fix-multiply
    expected:
      tool: read
      check: node check.js
